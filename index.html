<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibrahim Yahya</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

  :root {
    --bg-0: #e7edf3;
    --bg-1: #f4f7fa;
    --surface: rgba(255, 255, 255, 0.86);
    --surface-2: #eef3f8;
    --text: #0f2438;
    --text-muted: #4c6178;
    --accent: #123b5d;
    --accent-2: #2e6f9e;
    --glow: #35c3e8;
    --border: rgba(15, 36, 56, 0.11);
    --shadow: rgba(15, 36, 56, 0.16);
    --name-a: #123b5d;
    --name-b: #2e6f9e;
    --name-c: #6fb6dd;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-0: #060f19;
      --bg-1: #0a1826;
      --surface: rgba(15, 34, 55, 0.72);
      --surface-2: #142a42;
      --text: #eaf2fa;
      --text-muted: #93aac0;
      --accent: #5fb3e6;
      --accent-2: #3f8bc2;
      --glow: #52e3ff;
      --border: rgba(230, 240, 250, 0.14);
      --shadow: rgba(0, 0, 0, 0.55);
      --name-a: #eaf5fc;
      --name-b: #9adcf5;
      --name-c: #5fb3e6;
    }
  }

  :root[data-theme="dark"] {
    --bg-0: #060f19;
    --bg-1: #0a1826;
    --surface: rgba(15, 34, 55, 0.72);
    --surface-2: #142a42;
    --text: #eaf2fa;
    --text-muted: #93aac0;
    --accent: #5fb3e6;
    --accent-2: #3f8bc2;
    --glow: #52e3ff;
    --border: rgba(230, 240, 250, 0.14);
    --shadow: rgba(0, 0, 0, 0.55);
    --name-a: #eaf5fc;
    --name-b: #9adcf5;
    --name-c: #5fb3e6;
  }

  * { box-sizing: border-box; }

  @keyframes driftA {
    0%   { transform: translate(-6%, -4%) scale(1); }
    100% { transform: translate(4%, 6%) scale(1.12); }
  }

  @keyframes driftB {
    0%   { transform: translate(4%, 2%) scale(1.05); }
    100% { transform: translate(-5%, -6%) scale(1); }
  }

  body {
    margin: 0;
    min-height: 100vh;
    position: relative;
    background: linear-gradient(180deg, var(--bg-0), var(--bg-1));
    color: var(--text);
    font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    overflow-x: hidden;
  }

  .field {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .field span {
    position: absolute;
    border-radius: 50%;
    filter: blur(50px);
    opacity: 0.55;
    will-change: transform;
  }

  .field span.a {
    width: 60vmax;
    height: 60vmax;
    top: -22vmax;
    left: -16vmax;
    background: radial-gradient(circle, color-mix(in srgb, var(--glow) 32%, transparent), transparent 70%);
    animation: driftA 22s ease-in-out infinite alternate;
  }

  .field span.b {
    width: 50vmax;
    height: 50vmax;
    bottom: -18vmax;
    right: -14vmax;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent-2) 30%, transparent), transparent 70%);
    animation: driftB 26s ease-in-out infinite alternate;
  }

  .grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(color-mix(in srgb, var(--text) 5%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--text) 5%, transparent) 1px, transparent 1px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(60% 55% at 50% 30%, #000 0%, transparent 75%);
    mask-image: radial-gradient(60% 55% at 50% 30%, #000 0%, transparent 75%);
    opacity: 0.7;
  }

  @media (prefers-reduced-motion: reduce) {
    .field span { animation: none; }
  }

  .stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    perspective: 900px;
  }

  .card {
    position: relative;
    background: var(--surface);
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 42px 32px 28px;
    box-shadow:
      0 40px 70px -24px var(--shadow),
      0 2px 0 var(--border) inset,
      0 0 0 1px color-mix(in srgb, var(--glow) 8%, transparent);
    text-align: center;
    transform-style: preserve-3d;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    opacity: 0;
    animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(18px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card > * {
    opacity: 0;
    animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .card .mark   { animation-delay: 0.12s; }
  .card h1      { animation-delay: 0.22s; }
  .card .title  { animation-delay: 0.30s; }
  .card .pulse  { animation-delay: 0.38s; }
  .card .panel  { animation-delay: 0.46s; }
  .card footer  { animation-delay: 0.56s; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .card > * { animation: none; opacity: 1; transform: none; }
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50%      { transform: scale(1.08); opacity: 1; }
  }

  .mark {
    position: relative;
    width: 132px;
    height: 132px;
    margin: 0 auto 22px;
    display: grid;
    place-items: center;
  }

  .mark::before {
    content: "";
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--glow) 38%, transparent), transparent 70%);
    filter: blur(3px);
    animation: breathe 3.6s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .mark::before { animation: none; }
  }

  .mark img {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 6px 14px var(--shadow));
  }

  h1 {
    font-family: 'Sora', ui-sans-serif, system-ui, sans-serif;
    font-size: 1.78rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
    text-wrap: balance;
    background: linear-gradient(100deg, var(--name-a) 10%, var(--name-b) 45%, var(--name-c) 65%, var(--name-a) 90%);
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .title {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--accent-2);
    margin: 0 0 24px;
  }

  .pulse {
    width: 100%;
    height: 22px;
    margin-bottom: 26px;
    opacity: 0.9;
  }

  .pulse path {
    fill: none;
    stroke: var(--accent-2);
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 220;
    stroke-dashoffset: 220;
    filter: drop-shadow(0 0 4px color-mix(in srgb, var(--glow) 55%, transparent));
    animation: draw 3.2s ease-in-out infinite;
  }

  @keyframes draw {
    0% { stroke-dashoffset: 220; }
    45% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: -220; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pulse path { animation: none; stroke-dashoffset: 0; }
  }

  .panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 22px;
  }

  .readout {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    background: color-mix(in srgb, var(--surface-2) 92%, transparent);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 13px 16px;
    text-align: start;
    text-decoration: none;
    color: var(--text);
    font: inherit;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .readout::after {
    content: "";
    position: absolute;
    top: 0;
    left: -60%;
    width: 40%;
    height: 100%;
    background: linear-gradient(115deg, transparent, color-mix(in srgb, var(--glow) 22%, transparent), transparent);
    transform: skewX(-20deg);
    transition: left 0.6s ease;
    pointer-events: none;
  }

  .readout:hover::after { left: 130%; }

  .readout:hover,
  .readout:focus-visible {
    transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--accent-2) 55%, var(--border));
    box-shadow: 0 14px 28px -16px var(--shadow);
  }

  .readout:focus-visible {
    outline: 2px solid var(--glow);
    outline-offset: 2px;
  }

  .readout .icon {
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent);
    transition: background 0.18s ease, color 0.18s ease;
  }

  .readout:hover .icon {
    background: color-mix(in srgb, var(--glow) 22%, transparent);
    color: var(--accent-2);
  }

  .readout .icon svg { width: 19px; height: 19px; }

  .readout .body { min-width: 0; flex: 1; }

  .readout .label {
    display: block;
    font-size: 0.63rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 2px;
  }

  .readout .value {
    display: block;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 0.92rem;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .readout .go {
    flex: none;
    color: var(--text-muted);
    opacity: 0.7;
    transition: transform 0.18s ease;
  }

  .readout:hover .go { transform: translateX(3px); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(12px);
    background: var(--accent);
    color: #fff;
    font-size: 0.82rem;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 999px;
    box-shadow: 0 10px 26px -8px var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    white-space: nowrap;
    z-index: 2;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.7rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  footer .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--glow);
    box-shadow: 0 0 8px var(--glow);
    animation: breathe 2.4s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    footer .dot { animation: none; }
  }
</style>
</head>

    var callBtn = document.getElementById('callBtn');
    var toast = document.getElementById('toast');
    var card = document.getElementById('card');
    var timer = null;
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var fine = window.matchMedia('(pointer: fine)').matches;

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(function () {
        toast.classList.remove('show');
      }, 1800);
    }

    callBtn.addEventListener('click', function (e) {
      if (navigator.clipboard && fine) {
        e.preventDefault();
        navigator.clipboard.writeText('+201018019245').then(function () {
          showToast('Number copied');
        }).catch(function () {
          window.location.href = 'tel:+201018019245';
        });
      }
    });

    if (fine && !reduceMotion && card) {
      var raf = null;
      document.addEventListener('mousemove', function (e) {
        if (raf) return;
        raf = requestAnimationFrame(function () {
          var r = card.getBoundingClientRect();
          var cx = r.left + r.width / 2;
          var cy = r.top + r.height / 2;
          var dx = (e.clientX - cx) / (r.width / 2);
          var dy = (e.clientY - cy) / (r.height / 2);
          var max = 6;
          var rx = Math.max(-1, Math.min(1, -dy)) * max;
          var ry = Math.max(-1, Math.min(1, dx)) * max;
          card.style.transform = 'rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
          raf = null;
        });
      });
      document.addEventListener('mouseleave', function () {
        card.style.transform = 'rotateX(0deg) rotateY(0deg)';
      });
    }
  })();
</script>
</body>
</html>
